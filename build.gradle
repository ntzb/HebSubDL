plugins {
    id 'java'
    id 'application'
    id 'org.beryx.runtime' version '1.12.5'
    id 'edu.sc.seis.launch4j' version '4.0.0'
}

group 'com.nbs'
version '2.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(14)
    }

}

repositories {
    mavenCentral()
    maven { url "https://www.jetbrains.com/intellij-repository/releases" }
    maven { url "https://cache-redirector.jetbrains.com/intellij-dependencies" }
}

configurations {
    antTask
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'

    implementation group: 'org.xerial', name: 'sqlite-jdbc', version: '3.36.0.2'
    implementation group: 'commons-io', name: 'commons-io', version: '2.11.0'
    implementation group: 'commons-io', name: 'commons-io', version: '2.11.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.13.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.13.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.13.0'
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    implementation group: 'net.lingala.zip4j', name: 'zip4j', version: '2.9.0'
    implementation group: 'com.github.wtekiela', name: 'opensub4j', version: '0.4.1'
    implementation 'com.jetbrains.intellij.java:java-gui-forms-rt:203.7148.30'

    antTask 'com.jetbrains.intellij.java:java-compiler-ant-tasks:203.7148.30'
}

application {
    mainClassName = 'com.nbs.hebsubdl.MainGUI'
    applicationName = 'HebSubDL'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes "Main-Class": "com.nbs.hebsubdl.MainGUI",
                "Implementation-Title": project.name,
                "Implementation-Version": project.version
    }
    // toggle comment the following loop to include/not include libraries in the JAR
    // not including is for distributing compiled JRE for specific OS, and including is for distributing .jar file
    from {
        configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Wraps the fat jar produced by the `jar` task into a single portable .exe that
// runs on the system-installed JRE (no bundled runtime -- that is what `jpackage` does).
// Task: ./gradlew createExe  ->  build/launch4j/HebSubDL-<version>-portable.exe
launch4j {
    outfile = "HebSubDL-${project.version}-portable.exe"
    mainClassName = 'com.nbs.hebsubdl.MainGUI'
    jarTask = tasks.jar         // the fat jar, with all dependencies already inside
    dontWrapJar = false         // embed that jar INSIDE the exe -> one portable file
    copyConfigurable = []       // fat jar is self-contained; don't emit a lib/ folder
    headerType = 'gui'          // Swing app: no console window
    jreMinVersion = '14'
    errTitle = 'HebSubDL'
    downloadUrl = 'https://adoptium.net/temurin/releases/'
    messagesJreNotFoundError = 'HebSubDL requires Java 14 or newer, but no Java runtime was found. Please install Java 14+ and run this again.'
    messagesJreVersionError = 'HebSubDL requires Java 14 or newer. The Java runtime found on this machine is too old. Please install Java 14+ and run this again.'
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']

    additive = true
    //modules = ['jdk.crypto.ec', 'java.desktop', 'java.xml', 'jdk.unsupported', 'java.scripting', 'java.naming', 'java.xml']
    modules = [
            'jdk.crypto.ec',
            'jdk.charsets']

    launcher {
        noConsole = true
    }
    jpackage {
        // JDK 14's jpackage is an incubator build and copies 40 UCRT DLLs into
        // the image root; 16+ omits them. Resolved, not hardcoded - falls back
        // to the toolchain JDK if no newer one is installed.
        def modern = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
        if (modern.isPresent())
            jpackageHome = modern.get().metadata.installationPath.asFile.absolutePath
        // Uncomment and adjust the following line if your runtime task is configured to generate images for multiple platforms
        // targetPlatformName = "mac"


        def currentOs = org.gradle.internal.os.OperatingSystem.current()

        if(currentOs.windows) {
            installerOptions += ['--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut']
        }
        else if (currentOs.linux) {
            installerOptions += ['--linux-package-name', 'hellofx','--linux-shortcut']
        }
        else if (currentOs.macOsX) {
            installerOptions += ['--mac-package-name', 'hellofx']
        }
    }
}
